services:
  - type: web
    name: nova-api
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.production:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1
    disk:
      name: nova-data
      mountPath: /opt/render/project/src/data
      sizeGB: 10
    envVars:
      - key: NOVA_ENV
        value: production
      - key: NOVA_DATA_DIR
        value: /opt/render/project/src/data
      - key: NOVA_SESSION_DB
        value: /opt/render/project/src/data/sessions.sqlite3
      - key: NOVA_ALLOWED_ORIGINS
        sync: false
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gpt-oss:20b
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: nova-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
