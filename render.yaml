services:
  - type: web
    name: nova-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: rm -rf ~/.cache/pip && python -m pip install --upgrade pip --no-cache-dir && python -m pip install --no-cache-dir -r requirements-render.txt
    startCommand: python -m uvicorn backend.render_entry:app --host 0.0.0.0 --port $PORT --log-level info
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: NOVA_ENV
        value: production
      - key: NOVA_DATA_DIR
        value: data
      - key: NOVA_SESSION_DB
        value: data/sessions.sqlite3
      - key: NOVA_ALLOWED_ORIGINS
        value: https://nova-frontend-i76e.onrender.com
      - key: NOVA_ENABLE_SEMANTIC_MEMORY
        value: "false"
      - key: NOVA_ENABLE_DOCS
        value: "false"
      - key: NOVA_ENABLE_DEMO
        value: "true"
      - key: NOVA_MAX_BODY_BYTES
        value: "524288"
      - key: NOVA_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: NOVA_LLM_PROVIDER
        value: openrouter
      - key: NOVA_LLM_MODEL
        value: nvidia/nemotron-3-ultra:free
      - key: NOVA_LLM_FALLBACK_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NOVA_DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: nova-frontend
    runtime: static
    buildCommand: cd frontend && npm install --no-audit --no-fund && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://nova-api-i07q.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
