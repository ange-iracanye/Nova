name: Apply guarded user settings patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[nova-settings-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply guarded patch
        run: python tools/apply_user_settings_patch.py

      - name: Syntax check backend
        run: python -m py_compile backend/api.py backend/core/nova_core.py backend/user_settings.py backend/__init__.py backend/settings.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/api.py backend/core/nova_core.py backend/__init__.py frontend/src/pages/Settings.jsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "[nova-settings-patch] Make user settings persistent and active"
          git push

      # Guarded installer: this workflow is temporary and will be removed after validation.
