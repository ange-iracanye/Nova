name: Validate user settings

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate settings integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate backend settings code
        run: |
          python -m py_compile backend/api.py backend/core/nova_core.py backend/user_settings.py backend/__init__.py backend/settings.py
          test -f backend/user_settings.py

      - name: Validate frontend settings source
        run: |
          test -f frontend/src/pages/Settings.jsx
          grep -q "nova_language" frontend/src/i18n.js
          grep -q "applyNovaLanguage" frontend/src/pages/Settings.jsx

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Guard against self-modifying workflow regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-user-settings.yml').read_text(encoding='utf-8')
          guard = source.index('      - name: Guard against self-modifying workflow regressions')
          executable = source[:guard]
          forbidden = ('git push', 'git commit', 'contents: write')
          found = [item for item in forbidden if item in executable]
          if found:
              raise SystemExit(f'Forbidden workflow behavior found: {found}')
          if 'contents: read' not in executable:
              raise SystemExit('Workflow must keep contents: read permission')
          print('Workflow is read-only and non-self-modifying')
          PY
