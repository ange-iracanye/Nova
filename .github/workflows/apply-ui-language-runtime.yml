name: Apply UI language runtime

on:
  push:
    branches: [main]

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[nova-ui-language]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded runtime patch
        run: python tools/apply-ui-language-runtime.py
      - name: Validate frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit runtime patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/main.jsx frontend/src/uiLanguageRuntime.js
          git diff --cached --check
          git commit -m '[nova-ui-language] Wire live UI language runtime' || exit 0
          git push
