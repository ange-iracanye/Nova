name: Nova UI finalization checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    name: Final UI integrity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Check production entry order
        run: |
          test -f frontend/src/production-entry.jsx
          python - <<'PY'
          from pathlib import Path
          source = Path('frontend/src/production-entry.jsx').read_text(encoding='utf-8')
          required = [
              'import "./production-api.js";',
              'import "./uiLanguageRuntime.js";',
              'import "./uiLanguageReloadBridge.js";',
              'import "./main.jsx";',
          ]
          positions = []
          for item in required:
              position = source.find(item)
              if position < 0:
                  raise SystemExit(f'Missing production entry import: {item}')
              positions.append(position)
          if positions != sorted(positions):
              raise SystemExit('Production entry import order is invalid')
          print('Production entry order is valid')
          PY

      - name: Build final production bundle
        working-directory: frontend
        run: npm run build

      - name: Guard against workflow self-modification
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/nova-ui-finalize.yml').read_text(encoding='utf-8')
          guard = source.index('      - name: Guard against workflow self-modification')
          executable = source[:guard]
          forbidden = ('git push', 'git commit', 'contents: write')
          found = [item for item in forbidden if item in executable]
          if found:
              raise SystemExit(f'Forbidden workflow behavior found: {found}')
          if 'contents: read' not in executable:
              raise SystemExit('Workflow must keep contents: read permission')
          print('Workflow is read-only and non-self-modifying')
          PY
