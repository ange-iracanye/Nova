name: Nova UI finalization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[nova-ui-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair generated translation block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/i18n.js')
          s = p.read_text(encoding='utf-8')
          marker = '// NOVA_UI_EXTRA_LANGUAGES'
          if marker not in s:
              raise SystemExit('translation marker missing')
          head, tail = s.split(marker, 1)
          tail = tail.replace('\\n', '\n')
          p.write_text(head + marker + tail, encoding='utf-8')
          PY
      - name: Commit repaired file
        run: |
          git config user.name 'nova-bot'
          git config user.email 'nova-bot@users.noreply.github.com'
          git add frontend/src/i18n.js
          git diff --cached --quiet || git commit -m '[nova-ui-repair] Fix i18n.js syntax'
          git push