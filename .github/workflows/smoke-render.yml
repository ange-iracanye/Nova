name: One-time Render smoke test

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install public Render dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-render.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Import Render entrypoint
        env:
          NOVA_ENV: production
          NOVA_ALLOWED_ORIGINS: https://nova-frontend-i76e.onrender.com
          NOVA_ENABLE_SEMANTIC_MEMORY: "false"
          NOVA_ENABLE_DOCS: "false"
          NOVA_ENABLE_DEMO: "true"
        run: python -c "from backend.render_entry import app; print('RENDER_ENTRY_IMPORT_OK', app)"

      - name: Remove one-time smoke workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/smoke-render.yml
          git commit -m "chore: remove one-time Render smoke test"
          git push
