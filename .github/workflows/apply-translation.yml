name: Apply translation settings patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[nova-translation-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply guarded translation patch
        run: python tools/apply_translation_patch.py

      - name: Syntax check backend
        run: python -m py_compile backend/settings.py backend/language_support.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit translation patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/settings.py frontend/src/pages/Settings.jsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "[nova-translation-patch] Expand settings language support"
          git push
